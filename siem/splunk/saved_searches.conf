[TextThreat High Risk Threshold Alert]
search = index=textthreat event.module=textthreat digital_wellbeing.risk_score>0.8 | table _time text_hash session_id source_platform digital_wellbeing.risk_score digital_wellbeing.harm_types{} digital_wellbeing.model_version
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 0
dispatch.earliest_time = -5m
dispatch.latest_time = now
description = TextThreat threshold alert for high-risk digital well-being events.

[TextThreat Toxicity Stress Cooccurrence Alert]
search = index=textthreat event.module=textthreat digital_wellbeing.risk_score>0.8 | spath path=digital_wellbeing.harm_types{} output=harm_type | mvexpand harm_type | eval is_toxicity=if(harm_type IN ("toxic","severe_toxic","obscene","threat","insult","identity_hate"),1,0) | eval is_stress=if(harm_type="stress",1,0) | bin _time span=30m | stats max(is_toxicity) as toxicity max(is_stress) as stress values(text_hash) as text_hashes max(digital_wellbeing.risk_score) as max_risk by session_id _time | eval cooccurrence_risk=min(max_risk+0.1,1.0) | where toxicity=1 AND stress=1
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 0
dispatch.earliest_time = -35m
dispatch.latest_time = now
description = TextThreat co-occurrence alert for toxicity and stress signals in the same 30-minute session window.
